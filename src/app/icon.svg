<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="beerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="foamGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F5F5F5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle for better visibility -->
  <circle cx="50" cy="50" r="48" fill="#1a1a1a" opacity="0.1"/>
  
  <!-- Christmas tree (main element) -->
  <!-- Tree trunk -->
  <rect x="47" y="75" width="6" height="10" fill="#8B4513" rx="1"/>
  
  <!-- Tree layers (triangles) - larger and bolder -->
  <path d="M 50 15 L 20 70 L 80 70 Z" fill="#228B22" stroke="#006400" stroke-width="2"/>
  <path d="M 50 10 L 25 60 L 75 60 Z" fill="#32CD32" stroke="#228B22" stroke-width="1.5"/>
  <path d="M 50 5 L 30 50 L 70 50 Z" fill="#90EE90" stroke="#32CD32" stroke-width="1"/>
  
  <!-- Star on top -->
  <path d="M 50 0 L 52 8 L 60 8 L 53 13 L 55 21 L 50 16 L 45 21 L 47 13 L 40 8 L 48 8 Z" fill="#FFD700" stroke="#FFA500" stroke-width="0.5"/>
  
  <!-- Large ornaments on tree -->
  <circle cx="40" cy="50" r="3" fill="#FF0000"/>
  <circle cx="60" cy="50" r="3" fill="#0000FF"/>
  <circle cx="50" cy="40" r="3" fill="#FFD700"/>
  <circle cx="35" cy="60" r="2.5" fill="#FF00FF"/>
  <circle cx="65" cy="60" r="2.5" fill="#00FFFF"/>
  
  <!-- Beer mug integrated at bottom of tree -->
  <!-- Beer mug body -->
  <rect x="38" y="70" width="24" height="25" rx="3" fill="url(#beerGradient)" stroke="#8B4513" stroke-width="2"/>
  
  <!-- Beer mug handle (simplified) -->
  <path d="M 62 72 Q 70 72 70 78 Q 70 84 66 88 L 66 92 Q 66 95 62 95 L 62 72" fill="none" stroke="#8B4513" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Beer foam on top -->
  <ellipse cx="50" cy="70" rx="10" ry="5" fill="url(#foamGradient)"/>
  <ellipse cx="47" cy="68" rx="2.5" ry="1.5" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="53" cy="68" rx="2" ry="1" fill="#FFFFFF" opacity="0.9"/>
</svg>
